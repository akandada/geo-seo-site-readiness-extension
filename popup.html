<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Site Quality Index</title>
  <link rel="stylesheet" href="popup.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header>
    <h1>Site Quality Index</h1>
    <div>
      <button id="run" type="button">Run audit</button>
      <button id="openSiteScan" type="button">Site Scan</button>
      <button id="openReport" type="button" disabled>View full report</button>
    </div>
  </header>

  <section id="summary" class="card">
    <h2>Summary</h2>
    <div id="scoreRow">
      <div class="score"><span id="score">—</span>/100</div>
      <div id="grade">—</div>
    </div>
    <p id="summaryText">Click "Run audit".</p>
    <ul id="pageSummaries" class="page-list"></ul>
    <div id="progress" aria-live="polite"></div>
  </section>

  <section id="pathsCard" class="card">
    <h2>Additional paths</h2>
    <label for="pathList" class="input-label">Scan extra URLs under this origin (one per line).</label>
    <textarea id="pathList" placeholder="/about\n/blog\n/pricing"></textarea>
    <p class="input-note">Root-relative or full URLs only. Up to 5 extra paths; others are ignored.</p>
  </section>

  <section class="card">
    <h2>Category Scores</h2>
    <ul id="cats"></ul>
  </section>

  <section id="checks" class="card">
    <h2>Key Checks</h2>
    <ul id="checklist"></ul>
  </section>

  <section id="recommendationsCard" class="card">
    <h2>Recommendations</h2>
    <ul id="recommendations" class="recommendations"></ul>
  </section>

  <footer>
    <small>Tip: re-run after navigating to another page.</small>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
